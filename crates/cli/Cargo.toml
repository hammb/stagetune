[package]
name = "stagetune-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline test tool: run audio files through the StageTune engine"

[[bin]]
name = "stagetune"
path = "src/main.rs"

[dependencies]
stagetune-core = { path = "../core" }
hound = "3.5"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
